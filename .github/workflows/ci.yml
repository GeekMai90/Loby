# [INPUT]: 依赖公开仓库 push/Pull Request 事件、固定 Node/Rust 工具链、跨运行 Rust 缓存与 GitHub-hosted Ubuntu runner
# [OUTPUT]: 对外提供格式、架构、TypeScript、测试、Web 构建、Rust 与 npm 审计的公开合并证据，并沉淀可复用 Rust 编译缓存
# [POS]: .github/workflows 的非发布质量门禁；只读运行且不接触 updater 私钥或其他仓库 secret
# [PROTOCOL]: 变更时更新此头部，然后检查 AGENTS.md
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Restore Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/**/incremental
            !src-tauri/target/**/bundle
            !src-tauri/target/**/Loby*
            !src-tauri/target/**/libloby_lib*
          key: quality-v2-${{ runner.os }}-x86_64-unknown-linux-gnu-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            quality-v2-${{ runner.os }}-x86_64-unknown-linux-gnu-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Run repository quality gates
        run: npm run check

      - name: Audit production npm dependencies
        run: npm run audit:npm
