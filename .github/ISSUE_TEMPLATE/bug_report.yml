# [INPUT]: 依赖 GitHub Issue Forms 与公开问题去敏边界
# [OUTPUT]: 对外提供版本、平台、现象、复现步骤和隐私确认字段
# [POS]: ISSUE_TEMPLATE 的 Bug 收集表单，为跨平台排查提供最小可复现证据
# [PROTOCOL]: 变更时更新此头部，然后检查 AGENTS.md
name: Bug 报告
description: 报告一个可以复现的 Loby 问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请先确认内容中不含凭证、私钥、真实写作正文或个人绝对路径。
  - type: input
    id: version
    attributes:
      label: Loby 版本
      placeholder: 例如 0.4.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - macOS Apple Silicon
        - Windows x64
        - Linux x64
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题现象
      description: 说明实际发生了什么，以及你原本期望什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附去敏后的日志、截图和系统版本。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除凭证、私钥、真实写作正文和个人路径。
          required: true
