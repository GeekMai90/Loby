[package]
name = "loby"
version = "0.5.0"
description = "Local-first AI-friendly writing app"
authors = ["麦先生"]
edition = "2021"
license = "ISC"
repository = "https://github.com/GeekMai90/Loby"
homepage = "https://github.com/GeekMai90/Loby"

[[bin]]
name = "Loby"
path = "src/main.rs"

[lib]
name = "loby_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
dirs = "6"
dom_query = "0.27"
notify = "8"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "multipart", "query", "rustls", "stream"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tempfile = "3"
tantivy = { version = "0.26.1", default-features = false, features = ["mmap", "lz4-compression"] }
tantivy-jieba = "0.20.0"
trash = "5.2.6"
base64 = "0.22"
rmcp = { version = "3.0.0-beta.2", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
hmac = "0.12"
httpdate = "1"
sha1 = "0.10"
sha2 = "0.10"
urlencoding = "2"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSButton", "NSPasteboard", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["block2", "NSNotification", "NSOperation", "NSString"] }
quicklook = "0.2.0"
